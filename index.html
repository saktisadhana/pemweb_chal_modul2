<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg" aria-hidden="true">
        <div class="bg-art">
            <div class="bg-noise">
                <img src="asset/noise.png" alt="">
            </div>
            <div class="bg-wash"></div>
            <div class="bg-blob bg-rect-14"><img src="asset/rect-14.svg" alt=""></div>
            <div class="bg-blob bg-rect-31"><img src="asset/rect-31.svg" alt=""></div>
            <div class="bg-blob bg-rect-30"><img src="asset/rect-30.svg" alt=""></div>
            <div class="bg-blob bg-rect-32"><img src="asset/rect-32.svg" alt=""></div>
            <div class="bg-blob bg-rect-33"><img src="asset/rect-33.svg" alt=""></div>
        </div>
    </div>

    <main class="page">
        <h1 class="title">To Do List</h1>

        <section class="panel composer" aria-label="Search and filter">
            <form class="search-form" id="todo-form">
                <input type="text" id="todo-input" name="task" aria-label="Task">
                <button type="submit" class="search-btn" aria-label="Search">
                    <svg width="29" height="28" viewBox="0 0 32 31.15" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M30.5 29.65L23.51 22.86" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M14.39 26.52C21.51 26.52 27.28 20.92 27.28 14.01C27.28 7.1 21.51 1.5 14.39 1.5C7.27 1.5 1.5 7.1 1.5 14.01C1.5 20.92 7.27 26.52 14.39 26.52Z" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>

            <div class="filters">
                <button type="button" class="chip" data-filter="all">All</button>
                <button type="button" class="chip" data-filter="active">Active</button>
                <button type="button" class="chip" data-filter="completed">Completed</button>
            </div>
        </section>

        <section class="panel list-panel" aria-label="Tasks">
            <ul id="todo-list" class="todo-list"></ul>
        </section>
    </main>

    <template id="task-template">
        <li class="task">
            <span class="task-name"></span>
            <button type="button" class="delete-btn">Delete</button>
        </li>
    </template>

    <script src="script.js"></script>
</body>
</html>
